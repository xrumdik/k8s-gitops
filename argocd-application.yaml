apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: social-eng-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/<ваш-github-username>/k8s-gitops.git
    targetRevision: main
    path: apps/social-eng-app
  destination:
    server: https://kubernetes.default.svc
    namespace: social-eng
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
