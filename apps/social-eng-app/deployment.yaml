apiVersion: apps/v1
kind: Deployment
metadata:
  name: social-eng-app
  namespace: social-eng
spec:
  replicas: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: social-eng-app
  template:
    metadata:
      labels:
        app: social-eng-app
    spec:
      # Явное распределение: ровно один под на каждой ноде.
      # maxSkew: 1 + whenUnsatisfiable: DoNotSchedule — планировщик
      # не позволит двум подам оказаться на одной ноде, пока есть
      # свободная нода с меньшим количеством подов этого приложения.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: social-eng-app
      # Pod-уровень securityContext: закрывает находки Trivy #6, #8, #9
      # (runAsUser/runAsGroup ниже 10000 — 101 это стандартный uid/gid
      # рантайм-пользователя образа nginxinc/nginx-unprivileged) и #10
      # (seccomp-профиль).
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      # initContainer копирует уже собранную статику из образа в
      # отдельный emptyDir-том (html), примонтированный в основной
      # контейнер. Нужен, потому что при readOnlyRootFilesystem: true
      # основной контейнер не может ничего писать даже на старте —
      # а пустой emptyDir, примонтированный поверх /usr/share/nginx/html,
      # иначе перекрыл бы собранный сайт из образа.
      initContainers:
        - name: copy-html
          image: social-eng-app
          command: ["sh", "-c", "cp -r /usr/share/nginx/html/. /html-dest/"]
          volumeMounts:
            - name: html
              mountPath: /html-dest
      containers:
        - name: social-eng-app
          image: social-eng-app
          ports:
            - containerPort: 8080
          # Container-уровень securityContext: закрывает находки Trivy
          # #3 (allowPrivilegeEscalation), #4/#5 (drop ALL capabilities),
          # #7 (readOnlyRootFilesystem — корневая ФС только для чтения;
          # всё, что нужно писать в рантайме — nginx-кэш, pid-файл,
          # /tmp и сама HTML-директория — вынесено на отдельные emptyDir
          # ниже, они не подчиняются этому ограничению).
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            # Downward API — реальное имя пода и узла попадают в переменные
            # окружения контейнера, entrypoint-скрипт образа подставляет их
            # в статические HTML-файлы при каждом старте контейнера.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
      volumes:
        - name: html
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: social-eng-app
  namespace: social-eng
spec:
  type: NodePort
  selector:
    app: social-eng-app
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30902
