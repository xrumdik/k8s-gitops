apiVersion: apps/v1
kind: Deployment
metadata:
  name: social-eng-app
  namespace: social-eng
spec:
  replicas: 2
  selector:
    matchLabels:
      app: social-eng-app
  template:
    metadata:
      labels:
        app: social-eng-app
    spec:
      # Явное распределение: ровно один под на каждой ноде.
      # maxSkew: 1 + whenUnsatisfiable: DoNotSchedule — планировщик
      # не позволит двум подам оказаться на одной ноде, пока есть
      # свободная нода с меньшим количеством подов этого приложения.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: social-eng-app
      # Pod-уровень securityContext: закрывает находки Trivy #6, #8, #9
      # (runAsUser/runAsGroup ниже 10000 — 101 это стандартный uid/gid
      # пользователя nginx в официальном образе) и #10 (seccomp-профиль).
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: social-eng-app
          image: ghcr.io/xrumdik/social-eng-app:cc1ad72cd22506acc631a2880f121a738da8b9d4
          ports:
            - containerPort: 80
          # Container-уровень securityContext: закрывает находки Trivy
          # #3 (allowPrivilegeEscalation), #4/#5 (drop ALL capabilities),
          # #12 (единственная разрешённая capability — именно
          # NET_BIND_SERVICE, необходима, чтобы непривилегированный
          # пользователь мог слушать порт 80; без неё контейнер не
          # запустится — порты <1024 иначе требуют root).
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE"]
          env:
            # Downward API — реальное имя пода и узла попадают в переменные
            # окружения контейнера, entrypoint-скрипт образа подставляет их
            # в статические HTML-файлы при каждом старте контейнера.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: social-eng-app
  namespace: social-eng
spec:
  type: NodePort
  selector:
    app: social-eng-app
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30902
