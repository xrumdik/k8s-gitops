apiVersion: apps/v1
kind: Deployment
metadata:
  name: social-eng-app
  namespace: social-eng
spec:
  replicas: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: social-eng-app
  template:
    metadata:
      labels:
        app: social-eng-app
    spec:
      # Явное распределение: ровно один под на каждой ноде.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: social-eng-app
      # Pod-уровень securityContext: runAsUser/runAsGroup/seccompProfile
      # наследуются ОБОИМИ контейнерами (init и основным) автоматически.
      # А вот readOnlyRootFilesystem/capabilities/allowPrivilegeEscalation
      # НЕ наследуются от пода — их нужно задавать в каждом контейнере
      # отдельно, поэтому ниже они продублированы и в initContainer,
      # и в основном контейнере (иначе Trivy справедливо считает
      # initContainer вообще никак не защищённым).
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      # initContainer копирует уже собранную статику из образа в
      # отдельный emptyDir-том (html), примонтированный в основной
      # контейнер. Нужен, потому что при readOnlyRootFilesystem: true
      # основной контейнер не может ничего писать даже на старте —
      # а пустой emptyDir, примонтированный поверх /usr/share/nginx/html,
      # иначе перекрыл бы собранный сайт из образа.
      initContainers:
        - name: copy-html
          # через Kustomize images-transformer (kustomization.yaml), здесь
          # плейсхолдер без тега по архитектурным причинам (см. комментарий
          # в kustomization.yaml). Реальный образ всегда конкретный SHA-тег.
          image: social-eng-app
          command: ["sh", "-c", "cp -r /usr/share/nginx/html/. /html-dest/"]
          securityContext:
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 25m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
          volumeMounts:
            - name: html
              mountPath: /html-dest
      containers:
        - name: social-eng-app
          image: social-eng-app
          ports:
            - containerPort: 8080
          securityContext:
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            # Downward API — реальное имя пода и узла попадают в переменные
            # окружения контейнера, entrypoint-скрипт образа подставляет их
            # в статические HTML-файлы при каждом старте контейнера.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
      volumes:
        - name: html
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: social-eng-app
  namespace: social-eng
spec:
  type: NodePort
  selector:
    app: social-eng-app
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30902
